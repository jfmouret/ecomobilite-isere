name: Actualiser les arrêts et publier
on:
  push:
    branches: [main]
    paths: ['**.py', 'data/**', '.github/workflows/update.yml']
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
      timezone: Europe/Paris

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ecomobilite-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/camptocamp
          key: c2c-v1-${{ github.run_id }}
          restore-keys: c2c-v1-
      - name: Tester les associations et les liens
        run: python -m unittest discover -s tests -v
      - name: Récupérer les données officielles et créer les fiches
        run: python build.py
      - name: Vérifier les KMZ et les pages
        run: python verify.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
